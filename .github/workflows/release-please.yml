# 发行源码 | Release the source code

name: release-please

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.PAT_ACTIONS }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
